[phases.setup]
nixPkgs = [
    "python312",
    "glib",
    "nss",
    "nspr",
    "atk",
    "cups",
    "dbus",
    "libdrm",
    "pciutils",
    "mesa",
    "alsa-lib",
    "cairo",
    "pango",
    "gdk-pixbuf",
    "gtk3",
    "xorg.libX11",
    "xorg.libXcomposite",
    "xorg.libXcursor",
    "xorg.libXdamage",
    "xorg.libXext",
    "xorg.libXfixes",
    "xorg.libXi",
    "xorg.libXrandr",
    "xorg.libXrender",
    "xorg.libXScrnSaver",
    "xorg.libXtst",
    "xdg-utils"
]

[phases.install]
cmds = [
    "python -m venv --copies /opt/venv",
    ". /opt/venv/bin/activate && pip install -r requirements.txt"
]

[phases.build]
cmds = ["playwright install chromium"]

[start]
cmd = "export LD_LIBRARY_PATH=/nix/store/$(ls /nix/store | grep -m 1 glib-[0-9])/lib:/nix/store/$(ls /nix/store | grep -m 1 gtk3-[0-9])/lib:$LD_LIBRARY_PATH && uvicorn app.main:app --host 0.0.0.0 --port 8000"